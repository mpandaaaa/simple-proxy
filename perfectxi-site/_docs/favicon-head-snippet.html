<!-- ============================================================
     PERFECT XI — favicons, icons & manifest
     Replace your existing favicon/apple-touch/manifest/theme-color
     lines in <head> with this block. Upload every file from this
     folder to your SITE ROOT (same level as index.html).
     ============================================================ -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/mask-icon.svg" color="#3dba6f">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#090b0a">
<meta name="application-name" content="Perfect XI">
<meta name="apple-mobile-web-app-title" content="Perfect XI">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="msapplication-TileColor" content="#090b0a">
<meta name="msapplication-TileImage" content="/icon-192.png">

<!-- Social preview (refreshed art in og-image.png) -->
<meta property="og:image" content="/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="/og-image.png">
